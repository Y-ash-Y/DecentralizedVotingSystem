name: Contract and frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            VotingDapp/package-lock.json
            VotingDapp/voting-frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: VotingDapp
      - run: npm ci --ignore-scripts
        working-directory: VotingDapp/voting-frontend
      # Installation scripts stay disabled. Apply only our reviewed, pinned patch.
      - run: npm run deps:patch
        working-directory: VotingDapp
      - run: npm run test:tooling
        working-directory: VotingDapp
      - run: npm run release:check
        working-directory: VotingDapp
      - run: npm test
        working-directory: VotingDapp
      - run: npm run test:coverage
        working-directory: VotingDapp
      # Coverage changes artifacts. Restore and verify the normal build.
      - run: npm test
        working-directory: VotingDapp
      - run: npm test
        working-directory: VotingDapp/voting-frontend
      - run: npm run build
        working-directory: VotingDapp/voting-frontend
      - run: npm run test:ui
        working-directory: VotingDapp/voting-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: VotingDapp/voting-frontend
      - run: npm run test:browser
        working-directory: VotingDapp/voting-frontend
      - run: npm run test:coverage
        working-directory: VotingDapp/voting-frontend
      - run: npm run benchmark:events
        working-directory: VotingDapp/voting-frontend
      - run: npx hardhat run scripts/deploy-v2.js --network hardhat
        working-directory: VotingDapp
      - run: npm run benchmark
        working-directory: VotingDapp
      - run: npm run benchmark:v2
        working-directory: VotingDapp
  audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: contracts
            directory: VotingDapp
          - package: frontend
            directory: VotingDapp/voting-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=low
        working-directory: ${{ matrix.directory }}
