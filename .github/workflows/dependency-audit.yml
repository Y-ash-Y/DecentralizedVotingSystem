name: Dependency Audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: contracts
            directory: VotingDapp
          - package: frontend
            directory: VotingDapp/voting-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=low
        working-directory: ${{ matrix.directory }}
